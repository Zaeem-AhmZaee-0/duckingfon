<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="duckBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="duckBeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded badge -->
  <rect width="120" height="120" rx="30" fill="url(#bgGrad)"/>
  
  <!-- Subtle weather backdrop elements -->
  <circle cx="95" cy="25" r="22" fill="url(#sunGlow)"/>
  <circle cx="95" cy="25" r="10" fill="#fde047"/>
  
  <!-- Stylized Cloud -->
  <path d="M22 45 A10 10 0 0 1 38 38 A14 14 0 0 1 58 44 A10 10 0 0 1 64 54 L22 54 Z" fill="rgba(255,255,255,0.25)"/>

  <!-- Mascot: Fon the Weather Duck -->
  <g filter="url(#softShadow)">
    <!-- Body -->
    <ellipse cx="60" cy="74" rx="26" ry="22" fill="url(#duckBody)"/>
    
    <!-- Wing -->
    <path d="M48 68 C42 74 44 86 56 84 C62 82 66 74 62 68 C58 64 52 64 48 68 Z" fill="#ca8a04" opacity="0.4"/>

    <!-- Head -->
    <circle cx="60" cy="50" r="18" fill="url(#duckBody)"/>
    
    <!-- Feather Tuft on top of head -->
    <path d="M57 32 C55 26 62 25 61 32 C64 27 69 28 65 34 Z" fill="#eab308"/>

    <!-- Cute Cheeks -->
    <circle cx="48" cy="54" r="3.5" fill="#f87171" opacity="0.6"/>
    <circle cx="72" cy="54" r="3.5" fill="#f87171" opacity="0.6"/>

    <!-- Left Eye (Happy anime arch) -->
    <ellipse cx="53" cy="47" rx="3.5" ry="4.5" fill="#0f172a"/>
    <circle cx="54.2" cy="45.5" r="1.5" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="67" cy="47" rx="3.5" ry="4.5" fill="#0f172a"/>
    <circle cx="68.2" cy="45.5" r="1.5" fill="#ffffff"/>

    <!-- Duck Beak -->
    <path d="M52 53 C52 50 68 50 68 53 C68 59 52 59 52 53 Z" fill="url(#duckBeak)"/>
  </g>
  
  <!-- Raindrop accent / Sparkle -->
  <path d="M28 80 C28 77 31 73 31 73 C31 73 34 77 34 80 C34 82 32 83.5 31 83.5 C30 83.5 28 82 28 80 Z" fill="#38bdf8"/>
  <path d="M38 90 C38 88 40 85 40 85 C40 85 42 88 42 90 C42 91.5 41 92.5 40 92.5 C39 92.5 38 91.5 38 90 Z" fill="#38bdf8" opacity="0.8"/>
</svg>
